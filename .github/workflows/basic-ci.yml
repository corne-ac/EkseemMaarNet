# Builds the .NET MAUI app for Android (Linux runner) and iOS (macOS runner).
# Verifies the project compiles; no artifacts are published.

name: Build .NET MAUI Project

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: 10.0.x
  CSPROJ_TO_BUILD: EkseemMaarNet.csproj

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build Android
        run: dotnet build ${{ env.CSPROJ_TO_BUILD }} -f net10.0-android -c ${{ env.BUILD_CONFIGURATION }}

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios
      - name: Build iOS (simulator, unsigned)
        run: dotnet build ${{ env.CSPROJ_TO_BUILD }} -f net10.0-ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64
