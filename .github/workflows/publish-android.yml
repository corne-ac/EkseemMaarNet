# Publish to Google Play (MANUAL, NOT FINISHED YET).
#
# This is a starting point for later. It builds a signed .aab and can upload it to Google Play,
# but it will only work once the prerequisites below are in place. Run it from the Actions tab.
#
# Prerequisites / TODO before first use:
#   [ ] Create the app in Google Play Console with package name com.corne.ekseemmaarnet
#   [ ] Upload the very first .aab by hand (Google requires this before the API can upload)
#   [ ] Create an upload keystore (keep a safe backup, losing it means you can't update the app):
#         keytool -genkeypair -v -keystore upload.keystore -alias ekseem -keyalg RSA -keysize 2048 -validity 10000
#   [ ] Add repository secrets:
#         ANDROID_KEYSTORE_BASE64    base64 of upload.keystore   (base64 -i upload.keystore | pbcopy)
#         ANDROID_KEYSTORE_PASSWORD  keystore password
#         ANDROID_KEY_ALIAS          key alias (e.g. ekseem)
#         ANDROID_KEY_PASSWORD       key password
#         PLAY_SERVICE_ACCOUNT_JSON  Google Cloud service account JSON with access to the Play Console app
#   [ ] Decide on version numbers: versionCode uses the workflow run number below (always increases)
#   [ ] Store listing, content rating, privacy policy and data safety form in Play Console
name: Publish · Android (manual)

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track
        type: choice
        options: [ internal, alpha, beta, production ]
        default: internal
      upload:
        description: Upload to Google Play (leave off to only build the signed .aab)
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  PROJECT: EkseemMaarNet.csproj
  PACKAGE_NAME: com.corne.ekseemmaarnet

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Validate content.json
        run: python3 scripts/validate_content.py Resources/Raw/content.json

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "17"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Decode upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed .aab
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release
          -p:AndroidPackageFormat=aab
          -p:ApplicationVersion=${{ github.run_number }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore"
          -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}"
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          -o artifacts/android

      - uses: actions/upload-artifact@v7
        with:
          name: android-aab-${{ github.run_number }}
          path: artifacts/android/*-Signed.aab

      # TODO: confirm the status you want per track (e.g. "completed" for internal testing once set up).
      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: artifacts/android/*-Signed.aab
          track: ${{ inputs.track }}
          status: draft
