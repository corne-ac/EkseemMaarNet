# PR check: builds the Android app (Release, unsigned).
# Content-only changes skip this; pr-content.yml covers them.
name: PR build · Android

on:
  pull_request:
    branches: [ main ]
    paths-ignore: [ "**.md", "Resources/Raw/content.json" ]
  workflow_dispatch:

concurrency:
  group: pr-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-maui
        with:
          platform: android

      - name: Build
        run: dotnet build EkseemMaarNet.csproj -f net10.0-android -c Release
