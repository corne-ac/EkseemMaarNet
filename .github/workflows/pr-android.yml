# PR check: builds the Android app (Release, unsigned).
# Content-only changes skip this; pr-content.yml covers them.
name: PR build · Android

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main ]
    paths-ignore: [ "**.md", "Resources/Raw/content.json" ]
  workflow_dispatch:

concurrency:
  group: pr-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android
    # Skip draft PRs to save Actions minutes; they run once the PR is marked ready (or via "Run workflow").
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-maui
        with:
          platform: android

      # TargetFrameworks narrows restore to this platform (the other workload isn't installed here).
      - name: Build
        run: dotnet build EkseemMaarNet.csproj -f net10.0-android -p:TargetFrameworks=net10.0-android -c Release
