# PR check: builds the iOS app for the simulator (Release, no signing needed).
# Content-only changes skip this; pr-content.yml covers them.
name: PR build · iOS

on:
  pull_request:
    branches: [ main ]
    paths-ignore: [ "**.md", "Resources/Raw/content.json" ]
  workflow_dispatch:

concurrency:
  group: pr-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-maui
        with:
          platform: ios

      - name: Build (simulator)
        run: dotnet build EkseemMaarNet.csproj -f net10.0-ios -c Release -p:RuntimeIdentifier=iossimulator-arm64
